services:
  mongodb:
    image: mongo:7
    container_name: adventure-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: adventure-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Models are stored in this named volume, so they survive restarts.
      # To reuse models you already pulled on your machine, replace it with:
      #   - ~/.ollama:/root/.ollama
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot job: downloads gemma2:2b into ollama_data the first time, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: adventure-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma2:2b"]
    restart: "no"

volumes:
  mongo_data:
  ollama_data: